name: CoinKeeper Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj

      - name: Build project
        run: dotnet build ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj --no-restore -warnaserror

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check for pending EF Core migrations
        run: dotnet ef migrations has-pending-model-changes --project ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GT_PAT }}

      # Сборка и публикация Docker-образа для миграций
      - name: Build and push migration Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Common/CoinKeeper.Infrastructure/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/alekaz04/coinkeeper/migration-bundle:${{ github.ref_name }}
            ghcr.io/alekaz04/coinkeeper/migration-bundle:latest
          cache-from: type=registry,ref=ghcr.io/alekaz04/coinkeeper/migration-bundle:buildcache
          cache-to: type=registry,ref=ghcr.io/alekaz04/coinkeeper/migration-bundle:buildcache,mode=max

      # Сборка и публикация Docker-образа для основного API
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/CoinKeeper.Backend.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/alekaz04/coinkeeper/backend:${{ github.ref_name }}
            ghcr.io/alekaz04/coinkeeper/backend:latest
          cache-from: type=registry,ref=ghcr.io/alekaz04/coinkeeper/backend:buildcache
          cache-to: type=registry,ref=ghcr.io/alekaz04/coinkeeper/backend:buildcache,mode=max
