name: CoinKeeper dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj

      - name: Build project
        run: dotnet build ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj --no-restore

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check for pending EF Core migrations
        run: dotnet ef migrations has-pending-model-changes --project ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GT_PAT }}

      # Сборка и публикация Docker-образа для миграций
      - name: Build migration Docker image
        run: |
          docker build -f ./src/Common/CoinKeeper.Infrastructure/Dockerfile -t ghcr.io/alekaz04/coinkeeper/migration-bundle:dev .

      - name: Push migration Docker image
        run: |
          docker push ghcr.io/alekaz04/coinkeeper/migration-bundle:dev

      # Сборка и публикация Docker-образа для основного API
      - name: Build backend Docker image
        run: |
          docker build -f ./src/CoinKeeper.Backend.Api/Dockerfile -t ghcr.io/alekaz04/coinkeeper/backend:dev .

      - name: Push backend Docker image
        run: |
          docker push ghcr.io/alekaz04/coinkeeper/backend:dev
