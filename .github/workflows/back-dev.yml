name: CoinKeeper Dev CI/CD

on:
  push:
    branches: [dev]

jobs:
  build-and-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj

      - name: Build project
        run: dotnet build ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj --no-restore -warnaserror

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GT_PAT }}

      # Простая нативная сборка миграций
      - name: Build and push migration image
        run: |
          docker build -t ghcr.io/alekaz04/mock-api/migration-bundle:dev \
            -f ./src/Common/CoinKeeper.Infrastructure/Dockerfile .
          docker push ghcr.io/alekaz04/mock-api/migration-bundle:dev

      # Простая нативная сборка API
      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/alekaz04/mock-api/backend:dev \
            -f ./src/CoinKeeper.Backend.Api/Dockerfile .
          docker push ghcr.io/alekaz04/mock-api/backend:dev


  deploy-to-raspberry:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: success()

    steps:
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RASPBERRY_SSH_HOST }}
          username: ${{ secrets.RASPBERRY_SSH_USER }}
          password: ${{ secrets.RASPBERRY_SSH_PASSWORD }}
          port: ${{ secrets.RASPBERRY_SSH_PORT }}
          script: |
            # Переходим в директорию проекта
            cd /home/bl-server/dev/coinkeeper-api/CoinKeeper.Infrastructure/DockerCompose/Local

            # Останавливаем текущие контейнеры
            echo "Останавливаем контейнеры..."
            docker compose -f main.yml -p coinkeeper-dev down

            # Pull последнего образа
            echo "Загружаем последний образ..."
            docker compose -f main.yml -p coinkeeper-dev pull

            # Запускаем контейнеры
            echo "Запускаем контейнеры..."
            docker compose -f main.yml -p coinkeeper-dev up -d --remove-orphans

            # Чистим старые образы
            echo "Очистка старых образов..."
            docker image prune -af

            echo "Деплой завершен успешно!"
