name: CoinKeeper Dev CI/CD

on:
  push:
    branches: [dev]

jobs:
  build-and-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj

      - name: Build project
        run: dotnet build ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj --no-restore -warnaserror

      - name: Install dotnet-ef as local tool
        run: dotnet tool install --tool-path ./tools dotnet-ef

      - name: Check for pending EF Core migrations
        run: ./tools/dotnet-ef migrations has-pending-model-changes --project ./src/CoinKeeper.Backend.Api/CoinKeeper.Backend.Api.csproj

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Обновляем до версии 3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GT_PAT }}

      # Сборка и публикация Docker-образа для миграций
      - name: Build and push migration Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Common/CoinKeeper.Infrastructure/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/alekaz04/mock-api/migration-bundle:dev
          cache-from: type=registry,ref=ghcr.io/alekaz04/coinkeeper-api/migration-bundle:buildcache
          cache-to: type=registry,ref=ghcr.io/alekaz04/coinkeeper-api/migration-bundle:buildcache,mode=max

      # Сборка и публикация Docker-образа для основного API
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/CoinKeeper.Backend.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/alekaz04/mock-api/backend:dev
          cache-from: type=registry,ref=ghcr.io/alekaz04/coinkeeper-api/backend:buildcache
          cache-to: type=registry,ref=ghcr.io/alekaz04/coinkeeper-api/backend:buildcache,mode=max

  deploy-to-raspberry:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: success()

    steps:
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RASPBERRY_SSH_HOST }}
          username: ${{ secrets.RASPBERRY_SSH_USER }}
          password: ${{ secrets.RASPBERRY_SSH_PASSWORD }}
          port: ${{ secrets.RASPBERRY_SSH_PORT }}
          script: |
            # Переходим в директорию проекта
            cd /home/bl-server/dev/coinkeeper-api/CoinKeeper.Infrastructure/Local

            # Останавливаем текущие контейнеры
            echo "Останавливаем контейнеры..."
            docker compose -f main.yml -p coinkeeper-dev down

            # Pull последнего образа
            echo "Загружаем последний образ..."
            docker compose -f main.yml -p coinkeeper-dev pull

            # Запускаем контейнеры
            echo "Запускаем контейнеры..."
            docker compose -f main.yml -p coinkeeper-dev up -d --remove-orphans

            # Чистим старые образы
            echo "Очистка старых образов..."
            docker image prune -af

            echo "Деплой завершен успешно!"
